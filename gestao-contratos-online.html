<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestão de Contratos da Obra</title>
<style>
:root{--bg:#f2f6fc;--card:#fff;--ink:#0b2447;--mut:#5b6b85;--pri:#0a4ea3;--pri2:#1f7ae0;--line:#dbe5f3;--soft:#e8f1fd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1730;--card:#10234a;--ink:#eaf1ff;--mut:#9db2d6;--pri:#5aa2ff;--pri2:#8cc0ff;--line:#22407a;--soft:#17306a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1730;--card:#10234a;--ink:#eaf1ff;--mut:#9db2d6;--pri:#5aa2ff;--pri2:#8cc0ff;--line:#22407a;--soft:#17306a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px}
header{background:linear-gradient(135deg,#0a3d8f,#1f7ae0);color:#fff;padding:18px 16px 0}
.wrap{max-width:1100px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px}.sub{opacity:.85;font-size:13px;margin:0 0 12px}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.imp{background:#fff;color:#0a4ea3;border:0;border-radius:8px;padding:8px 12px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
nav{display:flex;gap:4px;overflow-x:auto}
nav button{flex:1;min-width:max-content;background:transparent;color:#fff;border:0;border-bottom:3px solid transparent;padding:10px 12px;font-size:14px;font-weight:600;cursor:pointer;opacity:.8}
nav button.on{opacity:1;border-color:#fff}
main{padding:14px 12px 40px}
.pane{display:none}.pane.on{display:block}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pri2);border-radius:10px;padding:12px}
.kpi small{color:var(--mut);font-size:12px;display:block}.kpi b{font-size:18px;color:var(--pri);word-break:break-word}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:14px;color:var(--pri)}
.grid2{display:grid;grid-template-columns:1fr;gap:12px}
.cv{position:relative;height:280px}
.flt{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.flt input,.flt select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:14px}
.flt .full{grid-column:1/-1}
.list{display:grid;grid-template-columns:1fr;gap:10px}
.it{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.it h4{margin:0 0 6px;font-size:14px;line-height:1.3}
.it .v{font-size:19px;font-weight:700;color:var(--pri)}
.it .f{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--mut);padding-top:4px;border-top:1px dashed var(--line);margin-top:4px}
.it .f span:last-child{color:var(--ink);text-align:right}
.bar{height:6px;background:var(--soft);border-radius:4px;margin:6px 0}.bar i{display:block;height:100%;background:var(--pri2);border-radius:4px}
.empty{text-align:center;color:var(--mut);padding:28px 12px}
.cnt{color:var(--mut);font-size:13px;margin:0 0 8px}
@media(min-width:720px){.kpis{grid-template-columns:repeat(4,1fr)}.grid2{grid-template-columns:1fr 1fr}.list{grid-template-columns:repeat(3,1fr)}.flt{grid-template-columns:repeat(4,1fr)}.flt .full{grid-column:auto}h1{font-size:24px}}
</style></head><body>
<header><div class="wrap">

<nav id="nav"><button data-t="res" class="on">Resumo Geral</button><button data-t="exe">Execução de Obras</button><button data-t="svc">Serviços Mensais</button></nav>
</div></header>
<main><div class="wrap">
<section class="pane on" id="p-res"></section>
<section class="pane" id="p-exe"></section>
<section class="pane" id="p-svc"></section>
</div></main>

const F={exe:{q:'',sel:{},min:0},svc:{q:'',sel:{},min:0}};let CH={};
