<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Gestão de Contratos da Obra</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --ink: #12263f;
      --muted: #5c728d;
      --line: #dfe9f5;
      --pri: #0a4ea3;
      --pri-2: #1f7ae0;
      --soft: #eaf3ff;
      --ok: #1e9e67;
      --warn: #f08a24;
      --danger: #d83b3b;
      --shadow: 0 8px 22px rgba(11, 42, 83, 0.08);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: Arial, Helvetica, sans-serif; }
    body { min-height: 100vh; }
    header {
      background: linear-gradient(135deg, #0a3d8f, #1f7ae0);
      color: white;
      padding: 18px 20px 0;
    }
    .wrap { max-width: 1200px; margin: 0 auto; }
    .top {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
      padding-bottom: 10px;
    }
    h1 { margin: 0; font-size: clamp(1.2rem, 2vw, 1.9rem); }
    .sub { margin: 8px 0 0; opacity: 0.9; font-size: 0.9rem; }
    .btn {
      border: 0; border-radius: 10px; background: white; color: var(--pri); font-weight: 700;
      padding: 10px 14px; cursor: pointer;
    }
    nav {
      display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px;
    }
    nav button {
      background: transparent; border: 0; color: white; padding: 12px 14px; cursor: pointer;
      border-bottom: 3px solid transparent; opacity: 0.8; font-weight: 700; font-size: 0.95rem;
      white-space: nowrap;
    }
    nav button.active { opacity: 1; border-color: white; }
    main { padding: 18px 16px 40px; }
    .pane { display: none; }
    .pane.active { display: block; }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px;
      margin-bottom: 18px;
    }
    .card {
      background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
      padding: 14px 16px; box-shadow: var(--shadow);
    }
    .kpi small { display: block; color: var(--muted); font-size: 0.74rem; text-transform: uppercase; }
    .kpi strong {
      display: block; margin-top: 8px; font-size: clamp(1.05rem, 2vw, 1.6rem); color: var(--pri);
      word-break: break-word;
    }
    .kpi .meta {
      margin-top: 6px; display: block; font-size: 0.74rem; color: var(--muted);
    }
    .card h3 {
      margin: 0 0 10px; font-size: 0.97rem; color: var(--pri);
    }
    .table-wrap {
      overflow-x: auto; background: var(--panel); border: 1px solid var(--line);
      border-radius: 14px; box-shadow: var(--shadow);
    }
    table {
      width: 100%; border-collapse: collapse; min-width: 900px;
    }
    th, td {
      border-bottom: 1px solid var(--line); padding: 10px 12px; text-align: left; vertical-align: top;
      font-size: 0.88rem;
    }
    th {
      background: #f8fbff; color: var(--ink); font-size: 0.75rem; text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .muted { color: var(--muted); }
    .empty {
      padding: 26px 18px; text-align: center; color: var(--muted); background: var(--panel);
      border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
    }
    .pill {
      display: inline-block; padding: 5px 9px; border-radius: 999px; font-weight: 700; font-size: 0.72rem;
      background: #edf5ff; color: var(--pri);
    }
    .status {
      display: inline-block; padding: 5px 9px; border-radius: 999px; font-size: 0.72rem; font-weight: 700;
    }
    .status.ok { background: rgba(30,158,103,0.12); color: var(--ok); }
    .status.warn { background: rgba(240,138,36,0.12); color: var(--warn); }
    .status.bad { background: rgba(216,59,59,0.12); color: var(--danger); }
    @media (max-width: 700px) {
      .top { flex-direction: column; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="top">
        <div>
          <h1>Gestão de Contratos da Obra</h1>
          <p class="sub" id="sub">Carregando dados da planilha…</p>
        </div>
        <button class="btn" id="refreshBtn">Atualizar</button>
      </div>
      <nav>
        <button class="active" data-tab="resumo">Resumo Geral</button>
        <button data-tab="execucao">Execução de Obras</button>
        <button data-tab="servicos">Serviços Mensais</button>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section id="resumo" class="pane active"></section>
    <section id="execucao" class="pane"></section>
    <section id="servicos" class="pane"></section>
  </main>

  <script>
    const SHEET_ID = '1B8pQjagCLiHI5USXBMGhgMEEaJ22IFc8FNvjs-i_yWc';
    const MONTHS = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

    const normalizeNumber = value => {
      if (value === null || value === undefined || value === '') return 0;
      if (typeof value === 'number' && Number.isFinite(value)) return value;
      let s = String(value).trim();
      if (!s) return 0;
      const negativo = s.startsWith('(') && s.endsWith(')');
      s = s.replace(/[()]/g, '').replace(/R\$/gi, '').replace(/[%\s]/g, '');
      if (!/\d/.test(s)) return 0;
      if (s.includes(',')) {
        const lastComma = s.lastIndexOf(',');
        const ints = s.slice(0, lastComma).replace(/\./g, '');
        const decs = s.slice(lastComma + 1).replace(/[^\d]/g, '');
        s = ints + '.' + decs;
      } else if (s.includes('.')) {
        s = s.replace(/,/g, '');
      }
      s = s.replace(/[^0-9.-]/g, '');
      const n = Number(s);
      return Number.isFinite(n) ? (negativo ? -n : n) : 0;
    };

    const formatMoney = v => {
      const number = Number(v) || 0;
      return number.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    };

    const formatPct = v => {
      const n = Number(v) || 0;
      return `${n.toLocaleString('pt-BR', { maximumFractionDigits: 1 })}%`;
    };

    const normalizeHeader = s => {
      return String(s || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-zA-Z0-9]+/g, ' ')
        .trim()
        .toUpperCase();
    };

    const findHeaderIndex = (headers, aliases) => {
      const normHeaders = headers.map(normalizeHeader);
      for (const alias of aliases) {
        const key = normalizeHeader(alias);
        const index = normHeaders.findIndex(h => h.includes(key));
        if (index >= 0) return index;
      }
      return -1;
    };

    const parseCSV = text => {
      const rows = [];
      let row = [];
      let cell = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (inQuotes) {
          if (ch === '"') {
            if (text[i + 1] === '"') {
              cell += '"';
              i++;
            } else {
              inQuotes = false;
            }
          } else {
            cell += ch;
          }
        } else {
          if (ch === '"') {
            inQuotes = true;
          } else if (ch === ',') {
            row.push(cell);
            cell = '';
          } else if (ch === '\n' || ch === '\r') {
            if (ch === '\r' && text[i + 1] === '\n') i++;
            if (cell.length || row.length) {
              row.push(cell);
              rows.push(row);
              row = [];
              cell = '';
            }
          } else {
            cell += ch;
          }
        }
      }

      if (cell.length || row.length) {
        row.push(cell);
        rows.push(row);
      }

      return rows.filter(r => r.some(v => String(v || '').trim() !== ''));
    };

    const fetchSheet = async (sheetName) => {
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=0&sheet=${encodeURIComponent(sheetName)}`;
      const response = await fetch(url);
      if (!response.ok) throw new Error(`Erro ao acessar aba ${sheetName}: ${response.status}`);
      const text = await response.text();
      return parseCSV(text);
    };

    const state = {
      contratos: [],
      resumo: [0, 0, 0, 0],
      meses: [],
      servicos: []
    };

    function renderTabButton() {
      document.querySelectorAll('nav button').forEach(btn => {
        const target = btn.dataset.tab;
        btn.classList.toggle('active', target === currentTab);
      });
      document.querySelectorAll('.pane').forEach(panel => {
        panel.classList.toggle('active', panel.id === currentTab);
      });
    }

    let currentTab = 'resumo';
    document.querySelectorAll('nav button').forEach(btn => {
      btn.addEventListener('click', () => {
        currentTab = btn.dataset.tab;
        renderTabButton();
      });
    });

    function statusBadge(pct) {
      if (pct >= 95) return '<span class="status ok">Acima de 95%</span>';
      if (pct >= 50) return '<span class="status warn">De 50% a 95%</span>';
      if (pct > 0) return '<span class="status bad">Até 50%</span>';
      return '<span class="status bad">Sem faturamento</span>';
    }

    function renderResumo() {
      const pane = document.getElementById('resumo');
      if (!state.contratos.length) {
        pane.innerHTML = '<div class="empty">Carregando dados…</div>';
        return;
      }

      const contratadoTotal = state.contratos.reduce((sum, c) => sum + (c.valorContratado || 0), 0);
      const faturadoTotal = state.contratos.reduce((sum, c) => sum + (c.valorFaturado || 0), 0);
      const saldo = contratadoTotal - faturadoTotal;
      const valorOrcado = state.resumo[0] || contratadoTotal;
      const custoIncorrido = state.resumo[1] || faturadoTotal;
      const aIncorrer = state.resumo[2] || Math.max(0, valorOrcado - custoIncorrido);
      const saldoOrcado = state.resumo[3] || Math.max(0, valorOrcado - custoIncorrido);

      const byDisciplina = {};
      state.contratos.forEach(c => {
        byDisciplina[c.disciplina] = (byDisciplina[c.disciplina] || 0) + (c.valorContratado || 0);
      });

      const topDisc = Object.entries(byDisciplina).sort((a, b) => b[1] - a[1]).slice(0, 6);

      pane.innerHTML = `
        <div class="grid">
          <div class="card kpi"><small>Orçamento total</small><strong>${formatMoney(valorOrcado)}</strong><span class="meta">Base da obra</span></div>
          <div class="card kpi"><small>Custo incorrido</small><strong>${formatMoney(custoIncorrido)}</strong><span class="meta">${formatPct((custoIncorrido / Math.max(valorOrcado, 1)) * 100)} do orçamento</span></div>
          <div class="card kpi"><small>A incorrer</small><strong>${formatMoney(aIncorrer)}</strong><span class="meta">${formatPct((aIncorrer / Math.max(valorOrcado, 1)) * 100)} do orçamento</span></div>
          <div class="card kpi"><small>Saldo orçado</small><strong>${formatMoney(saldoOrcado)}</strong><span class="meta">${formatPct((saldoOrcado / Math.max(valorOrcado, 1)) * 100)} do orçamento</span></div>
          <div class="card kpi"><small>Contratos</small><strong>${state.contratos.length}</strong><span class="meta">Total de contratos</span></div>
          <div class="card kpi"><small>Valor contratado</small><strong>${formatMoney(contratadoTotal)}</strong><span class="meta">Soma dos contratos</span></div>
          <div class="card kpi"><small>Faturado acumulado</small><strong>${formatMoney(faturadoTotal)}</strong><span class="meta">${formatPct((faturadoTotal / Math.max(contratadoTotal, 1)) * 100)} do contratado</span></div>
          <div class="card kpi"><small>Saldo a faturar</small><strong>${formatMoney(saldo)}</strong><span class="meta">Restante do contrato</span></div>
        </div>

        <div class="card">
          <h3>Contratado por disciplina</h3>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Disciplina</th>
                  <th>Valor contratado</th>
                </tr>
              </thead>
              <tbody>
                ${topDisc.map(([disc, valor]) => `
                  <tr>
                    <td>${disc || '—'}</td>
                    <td>${formatMoney(valor)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderExecucao() {
      const pane = document.getElementById('execucao');
      if (!state.contratos.length) {
        pane.innerHTML = '<div class="empty">Carregando dados dos contratos…</div>';
        return;
      }

      const rows = [...state.contratos].sort((a, b) => (b.valorContratado || 0) - (a.valorContratado || 0));
      pane.innerHTML = `
        <div class="card">
          <h3>Contratos em execução</h3>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Disciplina</th>
                  <th>Contrato</th>
                  <th>Empresa</th>
                  <th>Objeto</th>
                  <th>Valor</th>
                  <th>Faturado</th>
                  <th>Avanço</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody>
                ${rows.map(c => {
                  const pct = c.valorContratado ? ((c.valorFaturado || 0) / c.valorContratado) * 100 : 0;
                  return `
                    <tr>
                      <td>${c.disciplina || '—'}</td>
                      <td>${c.numero || '—'}</td>
                      <td>${c.empresa || '—'}</td>
                      <td>${c.objeto || '—'}</td>
                      <td>${formatMoney(c.valorContratado || 0)}</td>
                      <td>${formatMoney(c.valorFaturado || 0)}</td>
                      <td>${formatPct(pct)}</td>
                      <td>${statusBadge(pct)}</td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderServicos() {
      const pane = document.getElementById('servicos');
      if (!state.servicos.length) {
        pane.innerHTML = '<div class="empty">Sem dados de serviços mensais.</div>';
        return;
      }

      pane.innerHTML = `
        <div class="card">
          <h3>Prestação de serviço mensal</h3>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Centro de custo</th>
                  <th>Disciplina</th>
                  <th>Custo mensal</th>
                </tr>
              </thead>
              <tbody>
                ${state.servicos.map(item => `
                  <tr>
                    <td>${item.centroDeCusto || '—'}</td>
                    <td>${item.disciplina || '—'}</td>
                    <td>${formatMoney(item.custoMensal || 0)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    async function loadData() {
      const sub = document.getElementById('sub');
      try {
        const [servicosSheet, execSheet, resumoSheet] = await Promise.all([
          fetchSheet('CONTRATOS PRESTAÇÃO DE SERVIÇO'),
          fetchSheet('CONTRATOS DE EXECUÇÃO DE OBRAS'),
          fetchSheet('RESUMO GERAL')
        ]);

        // Serviços mensais
        const serviceHeaderIndex = servicosSheet.findIndex(row => row.some(v => /centro de custo/i.test(String(v || ''))));
        if (serviceHeaderIndex >= 0) {
          const header = servicosSheet[serviceHeaderIndex];
          const valorIdx = header.findIndex((v, i) => /custo mensal|valor/i.test(String(v || '')) && i > 0);
          const centroIdx = header.findIndex(v => /centro de custo/i.test(String(v || '')));
          const disciplinaIdx = header.findIndex(v => /disciplina/i.test(String(v || '')));

          state.servicos = servicosSheet.slice(serviceHeaderIndex + 1)
            .filter(r => String(r[0] || '').trim())
            .map(r => ({
              centroDeCusto: String(r[centroIdx] || '').trim(),
              disciplina: String(r[disciplinaIdx] || '').trim(),
              custoMensal: normalizeNumber(r[valorIdx >= 0 ? valorIdx : 2])
            }))
            .filter(item => item.custoMensal > 0);
        }

        // Execução de obras
        const execHeaderIndex = execSheet.findIndex(row => row.some(v => /empresa contratada/i.test(String(v || '')) || /empresa/i.test(String(v || ''))));
        if (execHeaderIndex < 0) throw new Error('Cabeçalho da aba EXECUÇÃO não encontrado');

        const execHeaders = execSheet[execHeaderIndex];
        const idx = {
          empresa: findHeaderIndex(execHeaders, ['EMPRESA CONTRATADA', 'EMPRESA', 'CONTRATADA', 'NOME EMPRESA']),
          disciplina: findHeaderIndex(execHeaders, ['DISCIPLINA', 'DISCIPLINA DE EXECUÇÃO']),
          numero: findHeaderIndex(execHeaders, ['NUMERO', 'NÚMERO', 'NRO', 'NUMERO CONTRATO', 'CONTRATO']),
          objeto: findHeaderIndex(execHeaders, ['OBJETO', 'OBJETO CONTRATADO', 'DESCRICAO OBJETO', 'DESCRIÇÃO DO OBJETO']),
          valorContratado: findHeaderIndex(execHeaders, ['VALOR CONTRATADO', 'CONTRATADO', 'VALOR ORCADO', 'VALOR TOTAL CONTRATADO']),
          valorFaturado: findHeaderIndex(execHeaders, ['VALOR FATURADO', 'VALOR FATURADO ACUMULADO', 'FATURADO', 'FATURADO ACUMULADO'])
        };

        if (idx.empresa < 0 || idx.valorContratado < 0 || idx.valorFaturado < 0) {
          throw new Error('Não localizou colunas de contrato/faturamento');
        }

        state.contratos = execSheet.slice(execHeaderIndex + 1)
          .filter(r => String(r[idx.empresa] || '').trim())
          .map(r => ({
            disciplina: String(r[idx.disciplina] || '').trim(),
            numero: String(r[idx.numero] || '').trim(),
            empresa: String(r[idx.empresa] || '').trim(),
            objeto: String(r[idx.objeto] || '').trim(),
            valorContratado: normalizeNumber(r[idx.valorContratado]),
            valorFaturado: normalizeNumber(r[idx.valorFaturado])
          }))
          .filter(item => item.empresa || item.objeto || item.numero);

        //Resumo geral
        const resValues = resumoSheet
          .filter(r => /^(?:\(|\[)?(?:\+|-|=)(?:\)|\])?$/.test(String(r[3] || '').trim()))
          .map(r => normalizeNumber(r[4]));

        if (resValues.length >= 4) {
          state.resumo = resValues.slice(0, 4);
        } else {
          const contratadoTotal = state.contratos.reduce((sum, c) => sum + (c.valorContratado || 0), 0);
          const faturadoTotal = state.contratos.reduce((sum, c) => sum + (c.valorFaturado || 0), 0);
          state.resumo = [contratadoTotal, faturadoTotal, Math.max(0, contratadoTotal - faturadoTotal), Math.max(0, contratadoTotal - faturadoTotal)];
        }

        renderResumo();
        renderExecucao();
        renderServicos();
        sub.textContent = 'Dados da planilha · atualizado às ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      } catch (error) {
        console.error(error);
        sub.textContent = 'Erro ao carregar a planilha. Tente atualizar novamente.';
        document.getElementById('resumo').innerHTML = '<div class="empty">Não foi possível carregar os dados da planilha. Verifique a conexão e a aba informada.</div>';
        document.getElementById('execucao').innerHTML = '<div class="empty">Não foi possível carregar os dados dos contratos.</div>';
        document.getElementById('servicos').innerHTML = '<div class="empty">Não foi possível carregar os serviços mensais.</div>';
      }
    }

    document.getElementById('refreshBtn').addEventListener('click', loadData);
    renderTabButton();
    loadData();
  </script>
</body>
</html>
